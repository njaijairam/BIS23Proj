<!DOCTYPE html>
<html>
<head>
  <title>Nicholas Jaijairam - Projects</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <img src="NJlogo.jpg" alt="NJ Logo" style="display: block; margin: 0 auto 20px auto; width: 120px; border-radius: 12px;">

  <!-- Hamburger Toggle Button -->
  <button class="menu-btn" onclick="toggleMenu()">&#9776;</button>

  <!-- Side Navigation Menu -->
  <div id="sideNav" class="sidenav">
    <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="goals.html">Goals</a>
    <a href="projects.html">Projects</a>
  </div>

  <!-- Background Overlay -->
  <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
  
  <div class="container">
    <h1>My Projects</h1>

    <h2>🚗 MPG Calculator</h2>
    <p>Calculate your vehicle's miles per gallon efficiency below.</p>

    <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px; text-align: left;">
      <div style="display: flex; flex-direction: column;">
        <label for="milesTraveled" style="font-weight: bold; margin-bottom: 5px; font-family: 'Trebuchet MS', sans-serif;">Miles Traveled:</label>
        <input type="number" id="milesTraveled" placeholder="e.g. 300" step="any" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="gallonsOfGas" style="font-weight: bold; margin-bottom: 5px; font-family: 'Trebuchet MS', sans-serif;">Gallons Used:</label>
        <input type="number" id="gallonsOfGas" placeholder="e.g. 10" step="any" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
      </div>

      <button onclick="calculateMPG()" style="background-color: #000; color: #fff; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: background 0.3s;">Calculate MPG</button>
    </div>

    <div id="result" style="margin-top: 20px; font-size: 20px; font-weight: bold; color: #0044cc; text-align: center;"></div>
  </div>

  <footer>
      <p>&copy; 2012 Nicholas Jaijairam. All Rights Reserved.</p>
      <p>
        <a href="about.html">About</a> | 
        <a href="goals.html">Goals</a> | 
        <a href="projects.html">Projects</a>
      </p>
  </footer>

  <script>
    function toggleMenu() {
      const nav = document.getElementById("sideNav");
      const overlay = document.getElementById("overlay");
      const menuWidth = window.innerWidth <= 480 ? "100%" : "250px";
      
      if (nav.style.width === menuWidth) {
        nav.style.width = "0";
        overlay.classList.remove("active");
      } else {
        nav.style.width = menuWidth;
        overlay.classList.add("active");
      }
    }
    
    document.addEventListener('mousemove', (e) => {
      const particle = document.createElement('div');
      particle.className = 'trail-particle';
      
      particle.style.left = e.clientX + 'px';
      particle.style.top = e.clientY + 'px';
      
      document.body.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 300);
    });

    function calculateMPG() {
      const miles = parseFloat(document.getElementById('milesTraveled').value);
      const gallons = parseFloat(document.getElementById('gallonsOfGas').value);
      const resultDiv = document.getElementById('result');

      if (isNaN(miles) || isNaN(gallons) || gallons <= 0 || miles < 0) {
        resultDiv.style.color = 'red';
        resultDiv.innerText = "Please enter valid positive numbers.";
        return;
      }

      const milesPerGallon = miles / gallons;

      resultDiv.style.color = '#0044cc';
      resultDiv.innerText = `Result: ${milesPerGallon.toFixed(2)} MPG`;
    }
  </script>
</body>
</html>
